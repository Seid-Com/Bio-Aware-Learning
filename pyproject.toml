[project]
name = "bio-aware-learning"
version = "0.1.0"
description = "TA-BC-BFL: Trust-Aware Blockchain-Enabled Bio-Aware Federated Learning Framework for Healthcare Data Integration"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "streamlit>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
simulate = "simulation.app:main"

[tool.pytest.ini_options]
testpaths = ["simulation/tests"]
pythonpath = ["simulation"]
